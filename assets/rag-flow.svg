<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="360" rx="16" fill="#12121c"/>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#60a5fa"/></marker>
    <marker id="at" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00cea8"/></marker>
  </defs>
  <text x="500" y="40" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">RAG: index once, retrieve wide, re-rank narrow, ground the answer</text>
  <!-- ingest row -->
  <text x="60" y="82" fill="#60a5fa" font-size="11.5" font-weight="700" letter-spacing="0.1em">INDEX</text>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="40" y="92" width="130" height="62" rx="11" fill="#16233f" stroke="#60a5fa" stroke-width="1.5"/><text x="105" y="128" fill="#fff">Documents</text>
    <rect x="210" y="92" width="150" height="62" rx="11" fill="#16233f" stroke="#60a5fa" stroke-width="1.5"/><text x="285" y="120" fill="#fff">Chunk</text><text x="285" y="139" fill="#9cc3f5" font-size="11" font-weight="400">on structure + overlap</text>
    <rect x="400" y="92" width="130" height="62" rx="11" fill="#16233f" stroke="#60a5fa" stroke-width="1.5"/><text x="465" y="128" fill="#fff">Embed</text>
    <rect x="570" y="92" width="150" height="62" rx="11" fill="#16233f" stroke="#60a5fa" stroke-width="1.5"/><text x="645" y="128" fill="#fff">Vector store</text>
  </g>
  <g stroke="#60a5fa" stroke-width="2">
    <line x1="170" y1="123" x2="202" y2="123" marker-end="url(#ab)"/>
    <line x1="360" y1="123" x2="392" y2="123" marker-end="url(#ab)"/>
    <line x1="530" y1="123" x2="562" y2="123" marker-end="url(#ab)"/>
  </g>
  <!-- query row -->
  <text x="60" y="212" fill="#00cea8" font-size="11.5" font-weight="700" letter-spacing="0.1em">ANSWER</text>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="40" y="222" width="120" height="62" rx="11" fill="#0f2d26" stroke="#00cea8" stroke-width="1.5"/><text x="100" y="258" fill="#fff">Query</text>
    <rect x="200" y="222" width="150" height="62" rx="11" fill="#132621" stroke="#00cea8" stroke-width="1.5"/><text x="275" y="250" fill="#fff">Retrieve</text><text x="275" y="269" fill="#7fd6c8" font-size="11" font-weight="400">wide candidates</text>
    <rect x="390" y="222" width="150" height="62" rx="11" fill="#132621" stroke="#00cea8" stroke-width="1.5"/><text x="465" y="250" fill="#fff">Re-rank</text><text x="465" y="269" fill="#7fd6c8" font-size="11" font-weight="400">narrow to best</text>
    <rect x="580" y="222" width="160" height="62" rx="11" fill="#132621" stroke="#00cea8" stroke-width="1.5"/><text x="660" y="250" fill="#fff">LLM + grounding</text><text x="660" y="269" fill="#7fd6c8" font-size="11" font-weight="400">"answer only from context"</text>
    <rect x="790" y="222" width="170" height="62" rx="11" fill="#0f2d26" stroke="#00cea8" stroke-width="1.5"/><text x="875" y="250" fill="#fff">Answer</text><text x="875" y="269" fill="#7fd6c8" font-size="11" font-weight="400">+ citations</text>
  </g>
  <g stroke="#00cea8" stroke-width="2">
    <line x1="160" y1="253" x2="192" y2="253" marker-end="url(#at)"/>
    <line x1="350" y1="253" x2="382" y2="253" marker-end="url(#at)"/>
    <line x1="540" y1="253" x2="572" y2="253" marker-end="url(#at)"/>
    <line x1="740" y1="253" x2="782" y2="253" marker-end="url(#at)"/>
  </g>
  <!-- link vector store to retrieve -->
  <path d="M645 154 L645 190 L275 190 L275 220" fill="none" stroke="#4a6fa5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#at)"/>
</svg>
