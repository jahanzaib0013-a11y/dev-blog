<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="360" rx="16" fill="#12121c"/>
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f0a"/></marker>
  </defs>
  <text x="500" y="42" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Payment-events pipeline (at-least-once, idempotent)</text>
  <!-- main flow -->
  <g font-size="14.5" font-weight="700" text-anchor="middle">
    <rect x="30" y="90" width="140" height="70" rx="12" fill="#0f2d26" stroke="#34d399" stroke-width="1.5"/>
    <text x="100" y="122" fill="#fff">Nayax</text><text x="100" y="142" fill="#7fd6c8" font-size="11.5" font-weight="400">terminal</text>
    <rect x="210" y="90" width="140" height="70" rx="12" fill="#1a2620" stroke="#34d399" stroke-width="1.5"/>
    <text x="280" y="122" fill="#fff">Webhook</text>
    <rect x="390" y="90" width="140" height="70" rx="12" fill="#1a2620" stroke="#34d399" stroke-width="1.5"/>
    <text x="460" y="122" fill="#fff">SQS Queue</text><text x="460" y="142" fill="#7fd6c8" font-size="11.5" font-weight="400">decouples</text>
    <rect x="570" y="90" width="140" height="70" rx="12" fill="#1a2620" stroke="#34d399" stroke-width="1.5"/>
    <text x="640" y="118" fill="#fff">Lambda</text><text x="640" y="138" fill="#7fd6c8" font-size="11.5" font-weight="400">upsert by txn id</text>
    <rect x="750" y="90" width="150" height="70" rx="12" fill="#0f2d26" stroke="#34d399" stroke-width="1.5"/>
    <text x="825" y="118" fill="#fff">Postgres</text><text x="825" y="138" fill="#7fd6c8" font-size="11.5" font-weight="400">integer minor units</text>
  </g>
  <g stroke="#34d399" stroke-width="2">
    <line x1="170" y1="125" x2="202" y2="125" marker-end="url(#ag)"/>
    <line x1="350" y1="125" x2="382" y2="125" marker-end="url(#ag)"/>
    <line x1="530" y1="125" x2="562" y2="125" marker-end="url(#ag)"/>
    <line x1="710" y1="125" x2="742" y2="125" marker-end="url(#ag)"/>
  </g>
  <!-- DLQ branch -->
  <path d="M640 160 L640 235 L470 235" fill="none" stroke="#f0a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ao)"/>
  <rect x="300" y="205" width="160" height="60" rx="12" fill="#2a1420" stroke="#f0a" stroke-width="1.5"/>
  <text x="380" y="232" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Dead-letter queue</text>
  <text x="380" y="251" fill="#f0a" font-size="11.5" text-anchor="middle">poison messages, inspect</text>
  <!-- reconcile -->
  <path d="M825 160 L825 300 L200 300 L200 300" fill="none" stroke="#915eff" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="60" y="275" width="200" height="55" rx="12" fill="#1c1830" stroke="#915eff" stroke-width="1.5"/>
  <text x="160" y="300" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Nightly reconcile</text>
  <text x="160" y="318" fill="#9a86d9" font-size="11.5" text-anchor="middle">must balance to the penny</text>
</svg>
